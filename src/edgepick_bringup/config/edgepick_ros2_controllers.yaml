# ros2_control configuration for the EdgePick mock hardware path.
# The joint names intentionally match the vendor MoveIt configuration so the
# controller action names remain compatible with move_group.
controller_manager:
  ros__parameters:
    # The DOFBOT I2C servo board cannot reliably consume a 100 Hz stream.
    # 20 Hz leaves enough bus/servo settling time while preserving smooth
    # JointTrajectoryController interpolation.
    update_rate: 20

    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    grip_group_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_group_controller:
  ros__parameters:
    joints:
      - Arm1_Joint
      - Arm2_Joint
      - Arm3_Joint
      - Arm4_Joint
      - Arm5_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      # Require the measured state to settle before reporting action success.
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      trajectory: 0.05
      goal: 0.05

grip_group_controller:
  ros__parameters:
    joint: grip_joint
